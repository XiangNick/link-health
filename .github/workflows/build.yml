name: 更新快照

# ────────────────────────────────────────────────────────────────
# 每天自动跑两次，也可以用 Actions 页面手动触发。
#
# 为什么监听 paths：
#   自动提交会改 config.json / status.json / report.html / filter.json，
#   如果 push 触发不加路径过滤，就会自己触发自己，无限循环。
#   这里只监听【手工维护的输入】—— config/ 和 scripts/。
# ────────────────────────────────────────────────────────────────

"on":
  schedule:
    # UTC 02:00 / 14:00 = 北京时间 10:00 / 22:00
    - cron: "0 2,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"

# 用内置 token 提交回仓库，不需要配置任何密钥
permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # build.py 只用标准库，所以没有 pip install 这一步。
      # 上游要装 requests，我们不用 —— 少一个依赖少一份麻烦。

      - name: 更新快照
        id: build
        run: python scripts/build.py

      # 把结果摘要写进 Actions 的 Summary 面板。
      # 这样跑完之后在 Actions 页面上就能直接看到结果，
      # 不用点进日志翻。
      - name: 写入 Actions 摘要
        if: always()
        run: |
          if [ ! -f status.json ]; then
            echo "### 运行结果" >> "$GITHUB_STEP_SUMMARY"
            echo "没有产出 status.json，这一步可能失败了。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, io
          s = json.load(io.open("status.json", encoding="utf-8"))
          c = s.get("counts", {})
          sites = s.get("sites", {})
          d = sites.get("dropped", {})
          sp = s.get("spider", {}) or {}

          print("### 运行结果")
          print()
          print(f"- **构建时间**：{s.get('built_at', '?')}")
          print(f"- **上游源**：{c.get('live',0)} live · {c.get('cache',0)} cache · {c.get('down',0)} down")
          print(f"- **站点**：{sites.get('total_input','?')} → {sites.get('kept','?')}")
          print(f"- **spider**：{sp.get('source_id','?')}（{sp.get('class_count','?')} 个类）")
          print()
          print("| 剔除原因 | 数量 |")
          print("| --- | --- |")
          print(f"| api 的类不在 spider 的 jar 里 | {len(d.get('missing_class', []))} |")
          print(f"| 命中 filter.json 规则 | {len(d.get('by_rule', []))} |")
          print(f"| 同名重复 | {len(d.get('duplicate', []))} |")
          print()
          print("详细报告见仓库根目录的 `report.html`。")
          PY

      - name: 提交产物
        run: |
          # ══════════════════════════════════════════════════════════
          # 先校验产物，再决定要不要提交。
          #
          # 为什么必须有这道闸：
          #   build.py 只要【任意一个源抓成功】就返回 0 —— 哪怕一个站都没留下
          #   （见 build.py 末尾：`return 0 if (live or cache) else 1`）。
          #   极端情况下会产出"只有骨架、没有任何站点"的 config.json，而工作流
          #   会把它当正常结果提交上去 → App 读到空配置 → 家里电视什么都搜不出来。
          #
          #   失败时【保留主分支上的旧配置】才是我们要的行为：jsDelivr 继续发
          #   上一次成功那份，App 照常能用。宁可旧，不可空。
          # ══════════════════════════════════════════════════════════
          if [ ! -f config.json ]; then
            echo "::error::没有产出 config.json，本次不提交（保留上一版配置）"
            exit 1
          fi
          python - <<'PY'
          import io, json, sys
          # ⚠️ 必须显式 utf-8：runner 的默认编码不是 utf-8 时读中文会炸。
          data = json.load(io.open("config.json", encoding="utf-8"))
          n = len(data.get("sites") or [])
          # 下限取得很宽松：正常产出 100+，本机最差一轮也还有 68。
          # 设 10 是为了只拦"真出事了"，不误伤"今天源少"。
          if n < 10:
              print("::error::站点数异常（%d 个），拒绝提交，保留上一版配置" % n)
              sys.exit(1)
          print("站点数 %d，通过校验" % n)
          PY

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 三个产物在 .gitignore 里（仓库只留代码），所以必须 -f 强制加入。
          # 不加 -f 的话 `git add -A` 会尊重 .gitignore、永不提交它们，
          # jsDelivr 上就永远没有 config.json，App 直接读不到配置。
          git add -f config.json status.json report.html
          # 其余改动照常（主要是 filter.json 的 failure_streak 回写）
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::内容没有变化，跳过提交"
          else
            git commit -m "chore: 更新快照 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "::notice::已提交并推送"
          fi

      # ────────────────────────────────────────────────────────────────
      # 刷新 jsDelivr 缓存。这一步【不能省】。
      #
      # ⚠️ 2026-10-03 实测修正（推翻本文档早先"purge 后 20 秒全部刷新"的说法）：
      #   · purge 只有一个接口：purge.jsdelivr.net（返回 application/json）。
      #     testingcf / fastly / gcore 是【内容节点】，拿它们当 purge 用只会
      #     下载到文件本身、什么都没刷 —— 别往这个循环里加主机名。
      #   · cdn.jsdelivr.net 走 Fastly，testingcf/gcore 走 Cloudflare，
      #     是两套独立缓存，刷一套不等于刷另一套。
      #   · 对【分支引用 @main】的刷新是"最终一致 + 会被限流"：官方维护者在
      #     jsdelivr/jsdelivr#18471 里明说分支文件的 purge "isn't entirely
      #     reliable as there's currently some minimum cache time (up to 12 hours)"。
      #     实测：run #2 之后 cdn.jsdelivr.net 还是旧配置，几分钟后才变新。
      #   · 所以这里【必须看返回体】而不是只看退出码：被限流时 HTTP 仍是 200，
      #     但 body 里是 "throttled": true —— 只看退出码会以为刷成功了。
      #
      # 为什么还要一次刷三个路径：purge 接口一次一个路径，且会限流，
      # 所以逐个刷、每个失败都重试，最后再抽查一次配置是否真的变了。
      # ────────────────────────────────────────────────────────────────
      - name: 刷新 jsDelivr 缓存
        if: always()
        run: |
          set -uo pipefail

          BASE="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main"
          FAILED=0

          purge_one() {
            local target="$1"
            local attempt body
            for attempt in 1 2 3; do
              echo "刷新（第 ${attempt} 次）: ${target}"
              body=$(curl -sS -m 60 -w '\n%{http_code}' "${target}" 2>&1) || true
              echo "  ${body}"
              if echo "${body}" | grep -q '"status"[[:space:]]*:[[:space:]]*"finished"' \
                 && ! echo "${body}" | grep -q '"throttled"[[:space:]]*:[[:space:]]*true'; then
                echo "  ✅ 已受理"
                return 0
              fi
              if echo "${body}" | grep -q '"throttled"[[:space:]]*:[[:space:]]*true'; then
                echo "  ⚠️ 被限流（jsDelivr 对 purge 有频率限制），等 ${attempt}0 秒后重试"
              else
                echo "  ⚠️ 没拿到 finished，等 ${attempt}0 秒后重试"
              fi
              sleep $((attempt * 10))
            done
            echo "  ❌ 重试 3 次仍未确认刷新：${target}"
            return 1
          }

          # 三个产物都刷：config.json 是 App 要读的，另外两个是给人看的
          purge_one "${BASE}/config.json"  || FAILED=1
          purge_one "${BASE}/status.json"  || FAILED=1
          purge_one "${BASE}/report.html"  || FAILED=1

          # 抽查：主节点上的 config.json 是不是已经换成新产物。
          # ⚠️ 只当【告警】不当失败：分支引用的刷新是最终一致的，刚刷完可能还是旧的，
          #    这里红了会天天误报，反而让人不再看它。真正的失败由上面 purge_one 决定。
          #
          # 两个 python 调用都显式写 encoding 并取 stdout 的最后一行：
          # runner 的默认编码不一定是 utf-8（config.json 里有中文），
          # 而且失败时 python 会往 stderr 吐 traceback —— 不隔离的话站点数会判成 "?"。
          count_sites() {
            python -c "import io,json,sys;print(len(json.load(io.open(sys.argv[1],encoding='utf-8')).get('sites') or []))" "$1" 2>/dev/null | tail -n1
          }
          echo "---- 抽查 cdn.jsdelivr.net 上的 config.json ----"
          curl -sS -m 60 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/config.json" -o /tmp/remote-config.json || true
          LOCAL_SITES=$(count_sites config.json || echo "?")
          REMOTE_SITES=$(count_sites /tmp/remote-config.json || echo "?")
          echo "  本地产物站点数=${LOCAL_SITES}  主节点返回站点数=${REMOTE_SITES}"
          if [ -n "${LOCAL_SITES}" ] && [ "${LOCAL_SITES}" != "?" ] && [ "${LOCAL_SITES}" = "${REMOTE_SITES}" ]; then
            echo "  ✅ 主节点已是本次产物"
          else
            echo "::warning::主节点可能还是旧产物（分支引用刷新是最终一致的，通常几分钟内追平）。电视最多晚一会儿才拿到新配置，不影响已有配置可用性。"
          fi

          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::有产物没能确认刷新 —— 去 https://www.jsdelivr.com/tools/purge 手动刷这三个地址"
            exit 1
          fi
          echo "::notice::缓存刷新完成 —— 电视那边重开 App 就能拿到最新的"
