<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>link-health 构建报告</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #12151c; }
  #wrap {
    max-width: 760px; margin: 0 auto; padding: 48px 24px;
    color: #c9d1d9; font: 14px/1.8 "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 { font-size: 19px; color: #e6edf3; margin: 0 0 6px; }
  .sub { color: #8b949e; margin-bottom: 26px; }
  .box {
    background: #1b1f27; border: 1px solid #2b313b; border-radius: 8px;
    padding: 14px 16px; margin: 12px 0;
  }
  .box b { color: #7ee787; }
  .box .why { color: #8b949e; font-size: 12.5px; }
  ol { margin: 10px 0 0; padding-left: 22px; }
  li { margin: 8px 0; }
  a { color: #79c0ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .bad { color: #ff7b72; }
  .log {
    margin-top: 22px; padding: 12px 14px; background: #0d1117;
    border-radius: 6px; color: #8b949e; font: 12px/1.7 Consolas, monospace;
    white-space: pre-wrap; max-height: 220px; overflow: auto;
  }
</style>
</head>
<body>
  <div id="wrap">
    <h1>link-health 构建报告</h1>
    <div class="sub">正在按顺序尝试各 CDN 节点…</div>

    <div class="box">
      <b>等不及 / 全部失败？</b> 直接打开已下到你本地的快照，一定能看：<br>
      <a href="link-health-报告-快照.html">link-health-报告-快照.html</a>
      <div class="why">（那份是干净的静态副本，不依赖任何 CDN）</div>
    </div>

    <div id="fallback" style="display:none">
      <div class="box">
        <b class="bad">所有 CDN 节点都没取到报告。</b>
        <div class="why" style="margin-top:6px">
          这是网络/节点的问题，不是报告坏了。可行的办法：
        </div>
        <ol>
          <li>打开上面那个<b>本地快照</b>（已经下到你电脑里了，一定能看）；</li>
          <li>或者给浏览器挂上代理，再刷新本页；</li>
          <li>或者去 <a href="https://github.com/XiangNick/link-health/actions" target="_blank">Actions</a> 看运行记录。</li>
        </ol>
      </div>
    </div>

    <div class="log" id="log"></div>
  </div>

<script>
/*
  ⚠️ 为什么用 fetch + document.write，而不是 <iframe src="...">：
     实测（2026-10-03，用本机 Chrome + CDP 进的子文档，结论是确定性的）：
     只要服务端把 HTML 标成 Content-Type: text/plain，Chrome 在 <iframe> 和
     <object> 里都【当纯文本显示源码】—— 之前"iframe 不看 Content-Type"的说法是错的。
     jsDelivr 和 raw.githubusercontent 都以 text/plain 发 report.html，所以
     iframe 方案只会得到满屏 <!DOCTYPE html> 源码。
     fetch 拿到的是一段字符串，用 document.write 写进文档后由浏览器按 HTML 解析，
     这条路不经过 Content-Type 判定 —— 这才是能用的做法。

     jsDelivr 带 access-control-allow-origin: *（实测响应头里有），所以跨域 fetch 能过。

  ⚠️ 为什么不用 raw.githubusercontent.com：
     实测它在国内【拒绝连接】（用户实际遇到过）。所以只排 jsDelivr 的节点。

  ⚠️ 节点顺序：cdn.jsdelivr.net 对分支引用 @main 的刷新是"最终一致"的、可能滞后
     几小时（官方 issue jsdelivr/jsdelivr#18471），所以把它放在最后。
*/
var URLS = [
  "https://testingcf.jsdelivr.net/gh/XiangNick/link-health@main/report.html",
  "https://gcore.jsdelivr.net/gh/XiangNick/link-health@main/report.html",
  "https://fastly.jsdelivr.net/gh/XiangNick/link-health@main/report.html",
  "https://cdn.jsdelivr.net/gh/XiangNick/link-health@main/report.html"
];

var logEl = document.getElementById("log");
function say(s) { logEl.textContent += s + "\n"; }

function hostOf(u) { var m = u.match(/^https:\/\/([^\/]+)/); return m ? m[1] : u; }

/* 报告渲染后，往它里面插一个悬浮按钮，这样还能回到本页换节点。
   报告本身没有样式冲突风险：这个按钮用 fixed 定位 + 内联样式。 */
function closeButton() {
  return '<a href="link-health-报告.html" style="position:fixed;right:14px;bottom:14px;' +
         'z-index:2147483647;background:#1b1f27;color:#79c0ff;border:1px solid #2b313b;' +
         'border-radius:6px;padding:7px 12px;font:13px/1.4 \'Microsoft YaHei\',sans-serif;' +
         'text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.45)">← 返回 / 换节点</a>';
}

function tryAt(i) {
  if (i >= URLS.length) {
    say("全部节点失败。");
    document.getElementById("fallback").style.display = "block";
    document.querySelector(".sub").textContent = "所有节点都没取到报告。";
    return;
  }
  var url = URLS[i];
  say("尝试 [" + (i + 1) + "/" + URLS.length + "] " + hostOf(url));
  var t0 = Date.now();
  // cache: 'no-store' —— 否则浏览器会拿自己的缓存，看不到 Action 刚跑出来的新报告。
  fetch(url, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (html) {
      say("  ✅ 成功，用时 " + (Date.now() - t0) + "ms，收到 " + html.length + " 字符");
      if (html.indexOf("<!DOCTYPE html>") < 0) {
        throw new Error("内容不像报告（可能被网关拦了）");
      }
      document.open();
      document.write(html);
      document.write(closeButton());
      document.close();
    })
    .catch(function (e) {
      say("  ❌ 失败：" + e.message);
      tryAt(i + 1);
    });
}

say("报告地址：" + URLS.length + " 个节点，按顺序试。");
say("（cdn.jsdelivr.net 对分支 @main 的刷新可能滞后，所以排在最后）");
say("");
tryAt(0);
</script>
</body>
</html>
